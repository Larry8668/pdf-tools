[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf-tools"
version = "0.2.0"
description = "Offline tools to merge, compress and redact PDFs, plus image and video compression."
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.2.0",
    "pymupdf>=1.27.2.3",
    "pypdf>=6.9.2",
]

[project.scripts]
pdf-tools = "pdf_tools.cli:main"
